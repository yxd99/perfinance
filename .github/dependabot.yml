# One pull request per ecosystem per month, to keep the PR list quiet.
# Security updates still open right away, grouped into a single PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      pub:
        applies-to: version-updates
        patterns: ["*"]
      pub-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: build
