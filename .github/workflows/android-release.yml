name: Android release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Infos (style hints) do not block a release; warnings and errors do.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  deploy:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Resolve version
        id: version
        run: |
          name=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > android/key.properties

      - name: Write dart defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          UPDATE_MANIFEST_ID: ${{ secrets.GDRIVE_MANIFEST_FILE_ID }}
          APP_BUILD: ${{ steps.version.outputs.build }}
        run: |
          jq -n \
            --arg url "$SUPABASE_URL" \
            --arg anon "$SUPABASE_ANON_KEY" \
            --arg dsn "$SENTRY_DSN" \
            --arg manifest "$UPDATE_MANIFEST_ID" \
            --arg build "$APP_BUILD" \
            '{SUPABASE_URL: $url, SUPABASE_ANON_KEY: $anon, SENTRY_DSN: $dsn,
              SENTRY_ENVIRONMENT: "production", UPDATE_MANIFEST_ID: $manifest, APP_BUILD: $build,
              DISTRIBUTION: "drive"}' \
            > dart_defines.json

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define-from-file=dart_defines.json

      - name: Write version manifest
        env:
          APK_FILE_ID: ${{ secrets.GDRIVE_APK_FILE_ID }}
        run: |
          jq -n \
            --arg version "${{ steps.version.outputs.name }}" \
            --argjson build "${{ steps.version.outputs.build }}" \
            --arg url "https://drive.google.com/uc?export=download&id=${APK_FILE_ID}" \
            '{version: $version, build: $build, url: $url}' > version.json

      # APK first: the manifest must never point to a build that is not uploaded yet.
      - name: Upload to Google Drive
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          APK_FILE_ID: ${{ secrets.GDRIVE_APK_FILE_ID }}
          MANIFEST_FILE_ID: ${{ secrets.GDRIVE_MANIFEST_FILE_ID }}
        run: |
          bash scripts/drive_upload.sh "$APK_FILE_ID" \
            build/app/outputs/flutter-apk/app-release.apk perfinance.apk \
            application/vnd.android.package-archive
          bash scripts/drive_upload.sh "$MANIFEST_FILE_ID" \
            version.json version.json application/json

      - name: Remove signing files
        if: always()
        run: rm -f android/app/release.jks android/key.properties dart_defines.json
